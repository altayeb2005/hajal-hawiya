<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لأجل الحاوية</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a3a20">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Naskh Arabic","Droid Arabic Naskh",system-ui,sans-serif;background:#eef3ee;color:#16301f;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}[hidden]{display:none!important}
.lg{width:34px;height:28px;color:#f5b82e}
#sp,#lk{position:fixed;inset:0;background:linear-gradient(160deg,#0a3a20,#1a6b3c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;z-index:50;transition:opacity .6s}
#sp .lg{width:90px;height:72px}
#sp h1{font-size:46px;animation:w 2.2s ease .3s both}
@keyframes w{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
#lk input{padding:12px;border-radius:12px;border:2px solid #fff6;background:#fff2;color:#fff;text-align:center;font-size:22px;width:220px}
#lk button{padding:10px 40px;border:0;border-radius:12px;background:#f5b82e;color:#0a3a20;font-weight:700}
#pe{color:#fca5a5;min-height:22px}
header{background:linear-gradient(135deg,#0a3a20,#1a6b3c);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.r{display:flex;align-items:center;gap:8px}.r b{font-size:20px;display:block}.r small{opacity:.85}
.pill{background:#ffffff26;border:1px solid #fff6;color:#fff;border-radius:20px;padding:6px 12px}
.l{display:flex;flex-direction:column;gap:6px}
.fb{width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:#fff;font-size:17px;display:grid;place-items:center}
#ay{padding:8px 12px;text-align:center;font-family:"Amiri Quran","KFGQPC Uthmanic Script HAFS","Scheherazade New","Noto Naskh Arabic",serif;font-size:19px;line-height:2;min-height:68px;transition:.4s}
#st{display:flex;gap:6px;padding:6px 8px}
#st div{flex:1;background:#fff;border:1px solid #cfe0cf;border-radius:8px;text-align:center;padding:2px 0;font-size:10px;color:#567}
#st b{display:block;font-size:14px;color:#1a6b3c}
#tw{margin:4px 6px 130px;background:#fff;border-radius:12px;overflow:auto;box-shadow:0 2px 10px #0002}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid #d6e4d6;text-align:center;min-width:60px;height:52px;font-size:14px;white-space:nowrap}
tr:first-child th{background:#14572f;color:#fff}
.nm{position:sticky;right:0;min-width:130px;background:#f4f9f4;padding:0 8px;z-index:1}
tr:first-child .nm{background:#14572f}
.nm i{font-style:normal;margin-inline-start:8px;opacity:.75}
td{cursor:pointer;background:#fff7f6}
td.ok{background:#c9f2d5;color:#0d8a3c;font-size:26px;font-weight:700}
td.tt{background:#f0fbf3;font-weight:700;color:#14572f;cursor:default}
.f{position:fixed;width:48px;height:48px;border-radius:50%;border:0;color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 3px 10px #0004;z-index:5}
#ba{left:14px;bottom:16px;background:#1a6b3c;font-size:32px}#bk{left:14px;bottom:76px;background:#1d4ed8}
#bh{right:14px;bottom:16px;background:#7c3aed}#bt{right:14px;bottom:76px;background:#c2410c}
#md{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#mb{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:85vh;overflow:auto}
#mb h3{text-align:center;margin-bottom:10px;color:#0a3a20}
#mb input{width:100%;padding:10px;border:1.5px solid #bcd;border-radius:10px;margin-bottom:10px;font-size:16px}
#mb button{width:100%;padding:10px;border-radius:10px;border:1px solid #bcd;background:#f4f9f4;margin-top:6px}
#mb .pr{background:#1a6b3c;color:#fff;border:0}.sm{font-size:12px;color:#567}
.yp{display:flex;gap:6px}.yp input{text-align:center;margin:0!important}.yp button{width:50px!important;margin:0!important}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:ltr}.kp button{margin:0!important;padding:14px 0!important;font-size:18px}
#cd{background:#10241a;color:#5df08f;direction:ltr;text-align:left;padding:12px;font:26px monospace;border-radius:10px;margin-bottom:8px;min-height:54px;overflow:hidden}
.rs{border:1px solid #cfe0cf;border-radius:10px;padding:8px;margin-bottom:6px}
.rs span{display:inline-block;font-size:11px;padding:1px 6px;margin:2px;border-radius:10px;background:#fde4e4}.rs span.ok{background:#c9f2d5}
.rs button{width:auto!important;padding:3px 10px!important;margin:0 8px!important}
.ch{display:flex;align-items:flex-end;gap:6px;height:210px;border-bottom:2px solid #cde}
.ch div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:0}
.ch u{width:70%;background:linear-gradient(#4cc27f,#14572f);border-radius:5px 5px 0 0}.ch u.g{background:linear-gradient(#ffd25e,#e09a00)}
.ch small{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<svg style="display:none"><symbol id="lg" viewBox="0 0 60 48"><g fill="currentColor"><path d="M10 8L20 22h-6v26H6V22H0z"/><path d="M30 0L40 14h-6v34h-8V14h-6z"/><path d="M50 12L60 26h-6v22h-8V26h-6z"/></g></symbol></svg>
<div id="sp"><svg class="lg"><use href="#lg"/></svg><h1>لأجل الحاوية</h1></div>
<div id="lk" hidden><svg class="lg"><use href="#lg"/></svg><h2>لأجل الحاوية</h2><input id="pin" type="password" placeholder="الرمز السري"><button id="go">دخول</button><div id="pe"></div></div>
<div id="app" hidden>
<header><div class="r"><svg class="lg"><use href="#lg"/></svg><div><b>لأجل الحاوية</b><small id="yr"></small> <small id="sy"></small></div></div>
<button class="pill" id="tf">⚙️ <span id="tv"></span></button>
<div class="l"><button class="fb" id="bs">🔍</button><button class="fb" id="bc">🗓️</button></div></header>
<div id="ay"></div><div id="st"></div>
<div id="tw"><table id="tb"></table></div>
<button class="f" id="ba">+</button>
<button class="f" id="bk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="7" y="5" width="10" height="4" fill="#fff"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01" stroke-linecap="round" stroke-width="3"/></svg></button>
<button class="f" id="bh">📊</button><button class="f" id="bt">🗑️</button>
</div>
<div id="md" hidden><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const h=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7),esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const K='lh4',API='AIzaSyD35o-PgjEXEO-Uh-72B9ABQCaKLtJC-ic',B='https://firestore.googleapis.com/v1/projects/hajal-hawiya/databases/(default)/documents/',URL=B+'hajal/main',OLD=B+'hajal_data/main';
function load(){try{const s=JSON.parse(localStorage[K]);if(s&&s.m)return s}catch(e){}return{t:500,m:[],p:{},ts:0,ph:h('1234')}}
let S=load(),Y=2026,T,cy=2026,E='',vi=0;
const tot=y=>S.m.filter(x=>!x.d).reduce((s,x)=>s+((S.p[y]||{})[x.id]||[]).reduce((a,v)=>a+v,0),0);
const arr=(y,i)=>{S.p[y]=S.p[y]||{};return S.p[y][i]=S.p[y][i]||Array(12).fill(0)};
const st=t=>$('#sy').textContent=t;
function sv(){S.ts=Date.now();localStorage[K]=JSON.stringify(S);clearTimeout(T);T=setTimeout(push,1200);draw()}
async function push(){try{st('⏳');const r=await fetch(URL+'?key='+API+'&updateMask.fieldPaths=j&updateMask.fieldPaths=ts',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{j:{stringValue:JSON.stringify(S)},ts:{integerValue:String(S.ts)}}})});st(r.ok?'☁️✓':'⚠️')}catch(e){st('⚠️')}}
async function pull(){try{const r=await fetch(URL+'?key='+API);if(r.status==404){if(S.ts)push();else await old();return}if(!r.ok)throw 0;const c=JSON.parse((await r.json()).fields.j.stringValue);if(c.ts>S.ts){S=c;localStorage[K]=JSON.stringify(S);draw()}else if(c.ts<S.ts)push();st('☁️✓')}catch(e){st('⚠️')}}
async function old(){try{const d=await(await fetch(OLD+'?key='+API)).json();S=mig(JSON.parse(d.fields.data.stringValue));sv()}catch(e){}}
function mig(o){const n={t:o.contribValue||500,m:[],p:{},ts:Date.now(),ph:h('1234')};(o.members||[]).forEach(x=>n.m.push({id:x.id,n:x.name}));(o.trash||[]).forEach(x=>n.m.push({id:x.id,n:x.name,d:1}));for(const y in o.data||{}){n.p[y]={};for(const i in o.data[y])n.p[y][i]=o.data[y][i].map(v=>v?n.t:0)}return n}
function draw(){
 $('#yr').textContent='سنة '+Y;$('#tv').textContent=S.t+' ج';
 const L=S.m.filter(x=>!x.d);let cnt=0;
 const rows=L.map(x=>{const a=(S.p[Y]||{})[x.id]||[];cnt+=a.filter(Boolean).length;
  return '<tr><th class="nm"><span>'+esc(x.n)+'</span><i data-del="'+x.id+'">🗑️</i></th>'+M.map((_,i)=>'<td class="'+(a[i]?'ok':'')+'" data-c="'+x.id+':'+i+'">'+(a[i]?'✓':'')+'</td>').join('')+'<td class="tt">'+a.reduce((s,v)=>s+v,0)+'</td></tr>'}).join('');
 $('#tb').innerHTML='<tr><th class="nm">المساهم</th>'+M.map(m=>'<th>'+m+'</th>').join('')+'<th>الإجمالي</th></tr>'+rows;
 $('#st').innerHTML=[['المساهمون',L.length],['مدفوعة',cnt],['متبقية',L.length*12-cnt],['الإجمالي (ج)',tot(Y)]].map(x=>'<div><b>'+x[1]+'</b>'+x[0]+'</div>').join('')}
$('#tb').onclick=e=>{const d=e.target.closest('[data-del]');if(d){const m=S.m.find(x=>x.id==d.dataset.del);if(confirm('نقل "'+m.n+'" إلى المهملات؟ يمكنك استرجاعه لاحقاً.')){m.d=1;sv()}return}
 const c=e.target.closest('[data-c]');if(c){const[i,k]=c.dataset.c.split(':'),a=arr(Y,i);a[k]=a[k]?0:S.t;sv()}};
function mo(x){$('#mb').innerHTML=x+'<button onclick="cm()">إغلاق</button>';$('#md').hidden=false}
function cm(){$('#md').hidden=true}
$('#md').onclick=e=>{if(e.target.id=='md')cm()};
$('#ba').onclick=()=>mo('<h3>إضافة مساهم</h3><input id="nn" placeholder="اسم المساهم"><button class="pr" onclick="am()">تأكيد الإضافة</button>');
function am(){const n=$('#nn').value.trim();if(!n)return;S.m.push({id:'m'+Date.now().toString(36),n});sv();cm()}
$('#tf').onclick=()=>mo('<h3>تعرفة المساهمة الشهرية</h3><input id="tn" type="number" inputmode="numeric" value="'+S.t+'"><p class="sm">التغيير يسري على الخلايا الجديدة فقط، وما دُفع سابقاً يبقى بقيمته.</p><button class="pr" onclick="stf()">حفظ التعرفة</button><button onclick="cpn()">تغيير الرمز السري</button>');
function stf(){const v=+$('#tn').value;if(v>0){S.t=v;sv();cm()}}
function cpn(){const p=prompt('الرمز السري الجديد (4 أحرف على الأقل)');if(p&&p.length>=4){S.ph=h(p);sv();alert('تم تغيير الرمز')}}
$('#bs').onclick=()=>{mo('<h3>بحث عن مساهم</h3><input id="q" placeholder="اكتب الاسم" oninput="sr()"><div id="sr"></div>');sr()};
function sr(){const q=($('#q').value||'').trim();$('#sr').innerHTML=S.m.filter(x=>!x.d&&x.n.includes(q)).map(x=>{const a=(S.p[Y]||{})[x.id]||[];return '<div class="rs"><b>'+esc(x.n)+'</b> — '+a.reduce((s,v)=>s+v,0)+' ج ('+a.filter(Boolean).length+'/12) سنة '+Y+'<div>'+M.map((m,i)=>'<span class="'+(a[i]?'ok':'')+'">'+m+'</span>').join('')+'</div></div>'}).join('')||'<p>لا نتائج</p>'}
$('#bc').onclick=()=>{cy=Y;cal()};
function cal(){mo('<h3>التقويم</h3><div class="yp"><button onclick="cy=Math.max(2026,cy-1);cal()">▶</button><input type="number" value="'+cy+'" onchange="cy=Math.max(2026,+this.value||2026);cal()"><button onclick="cy++;cal()">◀</button></div><p style="margin:10px 0">إجمالي مساهمات '+cy+': <b>'+tot(cy)+' ج</b></p><button class="pr" onclick="Y=cy;draw();cm()">عرض بيانات هذه السنة</button>')}
$('#bh').onclick=()=>{const r=S.m.filter(x=>!x.d).map(x=>({n:x.n,s:((S.p[Y]||{})[x.id]||[]).reduce((a,v)=>a+v,0)})).sort((a,b)=>b.s-a.s).slice(0,8),mx=Math.max(1,...r.map(x=>x.s));
 mo('<h3>📊 أعلى المساهمين '+Y+'</h3><div class="ch">'+r.map((x,i)=>'<div><small>'+x.s+'</small><u class="'+(i?'':'g')+'" style="height:'+(x.s/mx*140+3)+'px"></u><small>'+esc(x.n)+'</small></div>').join('')+'</div>')};
$('#bt').onclick=tr;
function tr(){const d=S.m.filter(x=>x.d);mo('<h3>🗑️ المهملات</h3>'+(d.map(x=>'<div class="rs"><b>'+esc(x.n)+'</b><button onclick="rs(\''+x.id+'\')">استرجاع</button></div>').join('')||'<p>المهملات فارغة</p>'))}
function rs(i){S.m.find(x=>x.id==i).d=0;sv();tr()}
$('#bk').onclick=()=>{E='';mo('<h3>الآلة الحاسبة</h3><div id="cd">0</div><div class="kp">'+['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫'].map(k=>'<button onclick="kk(\''+k+'\')">'+(k=='/'?'÷':k=='*'?'×':k)+'</button>').join('')+'</div>')};
function kk(k){if(k=='C')E='';else if(k=='⌫')E=E.slice(0,-1);else if(k=='='){try{if(/^[\d.+\-*\/]+$/.test(E))E=String(+(Function('return '+E)()).toFixed(8))}catch(e){E=''}}else E+=k;$('#cd').textContent=E.replace(/\*/g,'×').replace(/\//g,'÷')||'0'}
const V=[['﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ وَأَنَّ سَعْيَهُ سَوْفَ يُرَىٰ ثُمَّ يُجْزَاهُ الْجَزَاءَ الْأَوْفَىٰ﴾','#fff1b8','#6b4a00'],['﴿إِنْ أَحْسَنتُمْ أَحْسَنتُمْ لِأَنفُسِكُمْ﴾','#d4f5e2','#0b5132'],['﴿وَمَا أَنفَقْتُم مِّن شَيْءٍ فَهُوَ يُخْلِفُهُ﴾','#e6e0fb','#3b2a86']];
function nv(){const v=V[vi++%3],e=$('#ay');e.style.opacity=0;setTimeout(()=>{e.textContent=v[0];e.style.background=v[1];e.style.color=v[2];e.style.opacity=1},400)}
$('#go').onclick=()=>{if(h($('#pin').value)==S.ph){sessionStorage.ok=1;$('#lk').hidden=true;$('#app').hidden=false}else $('#pe').textContent='الرمز غير صحيح'};
$('#pin').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
if(!S.ts){try{S=mig(JSON.parse(localStorage.hajal_hawiya_v2));localStorage[K]=JSON.stringify(S)}catch(e){}}
draw();nv();setInterval(nv,30000);pull();
addEventListener('online',pull);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
setTimeout(()=>{$('#sp').style.opacity=0;setTimeout(()=>{$('#sp').hidden=true;if(sessionStorage.ok)$('#app').hidden=false;else $('#lk').hidden=false},600)},3000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');document.head.insertAdjacentHTML('beforeend','<style>.nm i{display:inline-block;padding:12px 10px;font-size:20px}</style>');
$('#tb').onclick=e=>{const d=e.target.closest('[data-del]');if(d){const m=S.m.find(x=>x.id==d.dataset.del);mo('<h3>حذف مساهم</h3><p style="text-align:center;margin-bottom:8px">نقل «'+esc(m.n)+'» إلى المهملات؟ يمكنك استرجاعه لاحقاً.</p><button class="pr" style="background:#c2410c" onclick="dl(\''+m.id+'\')">نعم، احذف</button>');return}const c=e.target.closest('[data-c]');if(c){const[i,k]=c.dataset.c.split(':'),a=arr(Y,i);a[k]=a[k]?0:S.t;sv()}};
function dl(i){S.m.find(x=>x.id==i).d=1;sv();cm()}
function cpn(){mo('<h3>تغيير الرمز السري</h3><input id="np" type="password" placeholder="الرمز الجديد (4 أحرف على الأقل)"><button class="pr" onclick="spn()">حفظ</button>')}
function spn(){const p=$('#np').value;if(p.length>=4){S.ph=h(p);sv();cm()}}
 document.head.insertAdjacentHTML('beforeend','<style>#app{display:block!important;height:auto!important}#tw{margin:4px 6px 130px!important;flex:none!important}tr:first-child th{position:relative;z-index:3}tr:first-child .nm{position:sticky;right:0;z-index:5}</style>');
document.querySelectorAll('#tw>div').forEach(d=>d.remove());
function hs(){const t=$('#tb'),r=t.rows[0];if(!r)return;const y=Math.max(0,Math.min(-t.getBoundingClientRect().top,t.offsetHeight-r.offsetHeight));[...r.cells].forEach(c=>c.style.transform=y?'translateY('+y+'px)':'')}
const d0=draw;draw=function(){d0();hs()};
addEventListener('scroll',hs,{passive:true});
</script></body></html>
